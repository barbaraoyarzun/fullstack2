<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora Gas El Volcán - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">
                <a href="index.html" class="logo-link">
                    <img src="img/logo.jpg" alt="Logo Gas El Volcán" class="logo-img">
                    <span class="logo-nombre">Gas El Volcán</span>
                </a>
            </div>

            <input type="checkbox" id="menu-toggle" class="menu-toggle-input">
            <label for="menu-toggle" class="menu-toggle-btn">&#9776;</label>

            <ul class="menu-principal">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>

            <div class="acciones-usuario">
                <a href="login.html" class="activo">Iniciar sesión</a>
                <a href="registro.html">Registrar usuario</a>
                <a href="carrito.html" class="carrito-link">🛒 Carrito (<span id="contadorCarrito">0</span>)</a>
            </div>
        </nav>
    </header>

    <main class="contenedor-auth">
      <div class="auth-card">
      
        <div class="auth-header">
          <div class="logo-placeholder icono-auth">🔥</div>
          <h2>Gas El Volcán</h2>
          <p class="subtitulo">Ingresa a tu cuenta para gestionar tus pedidos</p>
        </div>

        <form id="formLogin" novalidate>
        
          <div class="form-group">
            <label for="correo">Correo electrónico</label>
            <input 
              type="email" 
              id="correo" 
              name="correo" 
              maxlength="100" 
              placeholder="ejemplo@duoc.cl o @gmail.com"
              required
            >
            <small class="mensaje-error" id="error-correo"></small>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              minlength="4" 
              maxlength="10" 
              placeholder="Entre 4 y 10 caracteres"
              required
            >
            <small class="mensaje-error" id="error-password"></small>
          </div>

          <button type="submit" class="btn-primario btn-block">Iniciar sesión</button>

          <div id="mensaje-general" class="mensaje-alerta"></div>
        </form>

        <div class="auth-footer">
          <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>

      </div>
    </main>

    <footer>
        <p>&copy; 2026 Distribuidora Gas El Volcán - Chillán, Ñuble</p>
    </footer>

    <script src="js/carrito.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
