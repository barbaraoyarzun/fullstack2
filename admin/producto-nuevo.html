<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - Gas El Volcán</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <div class="admin-layout">

        <aside class="admin-sidebar">
            <div class="admin-logo">
                <span>Gas El Volcán</span>
            </div>
            <ul class="admin-menu">
                <li><a href="home.html">Inicio</a></li>
                <li><a href="productos.html" class="activo">Productos</a></li>
                <li><a href="usuarios.html">Usuarios</a></li>
                <li><a href="../index.html">Ver sitio normal</a></li>
                <li><a href="../index.html" id="btn-cerrar-sesion">Cerrar Sesión</a></li>
            </ul>
        </aside>

        <main class="admin-contenido">
            <h1>Nuevo Producto</h1>

            <form id="formProductoNuevo" novalidate>

                <div class="form-group">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" name="codigo" autocomplete="off">
                    <span class="error-mensaje" id="errorCodigo"></span>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="off">
                    <span class="error-mensaje" id="errorNombre"></span>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" autocomplete="off"></textarea>
                    <span class="error-mensaje" id="errorDescripcion"></span>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria">
                        <option value="">Seleccione una categoría</option>
                        <option value="Cilindros de Gas">Cilindros de Gas</option>
                        <option value="Reguladores">Reguladores</option>
                        <option value="Mangueras y Conexiones">Mangueras y Conexiones</option>
                        <option value="Accesorios">Accesorios</option>
                    </select>
                    <span class="error-mensaje" id="errorCategoria"></span>
                </div>

                <div class="form-group">
                    <label for="unidad">Unidad</label>
                    <select id="unidad" name="unidad">
                        <option value="">Seleccione</option>
                        <option value="Unidad">Unidad</option>
                        <option value="Kit">Kit</option>
                    </select>
                    <span class="error-mensaje" id="errorUnidad"></span>
                </div>

                <div class="form-group">
                    <label for="precioResidencial">Precio Residencial</label>
                    <input type="number" id="precioResidencial" name="precioResidencial" min="0" step="1" autocomplete="off">
                    <span class="error-mensaje" id="errorPrecioResidencial"></span>
                </div>

                <div class="form-group">
                    <label for="precioComercial">Precio Comercial</label>
                    <input type="number" id="precioComercial" name="precioComercial" min="0" step="1" autocomplete="off">
                    <span class="error-mensaje" id="errorPrecioComercial"></span>
                </div>

                <div class="form-group">
                    <label for="stock">Stock</label>
                    <input type="number" id="stock" name="stock" min="0" step="1" autocomplete="off">
                    <span class="error-mensaje" id="errorStock"></span>
                </div>

                <div class="form-group">
                    <label for="stockCritico">Stock Crítico</label>
                    <input type="number" id="stockCritico" name="stockCritico" min="0" step="1" autocomplete="off">
                    <span class="error-mensaje" id="errorStockCritico"></span>
                </div>

                <div class="form-group">
                    <label for="imagen">Imagen</label>
                    <input type="text" id="imagen" name="imagen" placeholder="img/nombre-archivo.jpg" autocomplete="off">
                    <span class="error-mensaje" id="errorImagen"></span>
                </div>

                <button type="submit" class="btn-primario">Guardar Producto</button>

            </form>

        </main>

    </div>
    
    <script src="../js/productos-data.js"></script>
    <script src="../js/validaciones-comunes.js"></script>
    <script src="../js/producto-nuevo.js"></script>
</body>
</html>
