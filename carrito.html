<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Distribuidora Gas El Volcán</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">
                <a href="index.html" class="logo-link">
                    <img src="img/logo.jpg" alt="Logo Gas El Volcán" class="logo-img">
                    <span class="logo-nombre">Gas El Volcán</span>
                </a>
            </div>

            <input type="checkbox" id="menu-toggle" class="menu-toggle-input">
            <label for="menu-toggle" class="menu-toggle-btn">&#9776;</label>

            <ul class="menu-principal">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>

            <div class="acciones-usuario">
              <a href="login.html">Iniciar sesión</a>
              <a href="registro.html">Registrar usuario</a>
              <a href="carrito.html" class="carrito-link activo">🛒 Carrito (<span id="contadorCarrito">0</span>)</a>
            </div>
        </nav>
    </header>

   <main class="contenedor-principal">
        <h1>Mi carrito de compras</h1>
        
        <div class="layout-carrito">

            <section class="items-carrito">
                <p id="carritoVacio" hidden>Tu carrito está vacío.</p>
                <table id="tablaCarrito" class="tabla-carrito">
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Subtotal</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoCarrito">
                    </tbody>
                </table>
            </section>

            <aside class="resumen-carrito">
                <div class="total-compra">
                    <span>TOTAL: $</span>
                    <span id="totalCarrito">0</span> <!-- ID cambiado a totalCarrito -->
                </div>
                
                <div class="cupon-descuento">
                    <input type="text" id="cupon" placeholder="Ingrese el cupón de descuento">
                    <button type="button" id="btn-aplicar-cupon" class="btn-secundario">APLICAR</button>
                </div>
                
                <button type="button" id="btn-pagar" class="btn-pago btn-block">PAGAR</button>
            </aside>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 Distribuidora Gas El Volcán - Chillán, Ñuble</p>
    </footer>

    <script src="js/productos-data.js"></script> 
    <script src="js/carrito.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/carrito-pagina.js"></script> 
</body>
</html>
