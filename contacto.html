<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Distribuidora Gas El Volcán</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">
                <a href="index.html" class="logo-link">
                    <img src="img/logo.jpg" alt="Logo Gas El Volcán" class="logo-img">
                    <span class="logo-nombre">Gas El Volcán</span>
                </a>
            </div>

            <input type="checkbox" id="menu-toggle" class="menu-toggle-input">
            <label for="menu-toggle" class="menu-toggle-btn">&#9776;</label>

            <ul class="menu-principal">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html" class="activo">Contacto</a></li>
            </ul>

            <div class="acciones-usuario">
              <a href="login.html">Iniciar sesión</a>
              <a href="registro.html">Registrar usuario</a>
              <a href="carrito.html" class="carrito-link">🛒 Carrito (<span id="contadorCarrito">0</span>)</a>
            </div>
        </nav>
    </header>

    <main class="contenedor-auth">
      <div class="auth-card">
      
        <div class="auth-header">
          <div class="icono-contacto">✉️</div>
          <h2>Gas El Volcán</h2>
          <p class="subtitulo">FORMULARIO DE CONTACTO</p>
        </div>

        <form id="formContacto" novalidate>
        
          <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input 
              type="text" 
              id="nombre" 
              name="nombre" 
              maxlength="100" 
              placeholder="Ej: Juan Pérez González"
              required
            >
            <small class="mensaje-error" id="error-nombre"></small>
          </div>

          <div class="form-group">
            <label for="correo">Correo electrónico</label>
            <input 
              type="email" 
              id="correo" 
              name="correo" 
              maxlength="100" 
              placeholder="ejemplo@duoc.cl o @gmail.com"
              required
            >
            <small class="mensaje-error" id="error-correo"></small>
          </div>

          <div class="form-group">
            <label for="comentario">Comentario o Consulta</label>
            <textarea 
              id="comentario" 
              name="comentario" 
              rows="5" 
              maxlength="500" 
              placeholder="Escribe tu mensaje aquí (máximo 500 caracteres)..."
              required
            ></textarea>
            <div class="contador-container">
              <small class="mensaje-error" id="error-comentario"></small>
              <small id="contador-caracteres" class="contador-texto">0 / 500</small>
            </div>
          </div>

          <button type="submit" class="btn-primario btn-block">Enviar Mensaje</button>

          <div id="mensaje-general" class="mensaje-alerta"></div>
        </form>

      </div>
    </main>

    <footer>
        <p>&copy; 2026 Distribuidora Gas El Volcán - Chillán, Ñuble</p>
    </footer>

    <script src="js/carrito.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/contacto.js"></script>
</body>
</html>
